              <div class="d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" value="1">
                  <label class="form-check-label" for="agree">
                    <?php echo lang('agree_license');?>
                  </label>
                </div>
                <button class="btn btn-primary px-4" id="agree-btn" disabled>
                  <?php echo lang('agree_license_to_continue');?>

    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let agree = document.getElementById('agree');
        let button = document.getElementById('agree-btn');

        if (agree) {
          agree.addEventListener('change', function () {
            if (this.checked) {
              button.disabled = false;
              button.setAttribute('onclick', "window.location='index.php?action=chenk&agree=1'");
            } else {
              button.disabled = true;
              button.removeAttribute('onclick');
            }
          });
        }
      });
    </script>
