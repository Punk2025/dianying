<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>{$seo.t}-{$cate.name}</title>
<meta name="author" content="{$seo.t}">
<meta name="keywords" content="{$seo.d},{$cate.name}">
<meta name="description" content="{$seo.k},{$cate.name}">
<link rel="icon" sizes="16x16" href="/template/9C18A513/img/favicon.png">
<link rel="stylesheet" href="/template/9C18A513/css/bootstrap.min.css">
<link rel="stylesheet" href="/template/9C18A513/css/owl.carousel.css">
<link rel="stylesheet" href="/template/9C18A513/css/line-awesome.min.css">
<link rel="stylesheet" href="/template/9C18A513/css/fontawesome.css">
<link rel="stylesheet" href="/template/9C18A513/css/style.css">
</head>
<body>
<!-- 页头 开始 -->
{inc:header.html}
<!-- 页头 结束 -->
<div class="section-heading section-heading-light" >
<div class="container-fluid">
<div class="section-heading-3">
<div class="row">
<div class="col-lg-12">
<div class="section-heading-3-title">
<h1>{$cate.name}</h1>
<p class="links"><a href="/">首页 <i class="las la-angle-right"></i></a> {$cate.name}</p>
</div>
</div>  
</div>
</div>
</div>
</div>
<section class="blog-layout-3 ">
<div class="container-fluid">
<!-- 广告开始
<p style="margin:5px 0;"><a href="广告链接" target="_blank"><img src="广告图片" style="width:1200px;height:120px;"></a></p>
广告结束 -->
<div class="row">
{loop:$videolist $v}
<div class="col-lg-4"><div class="post-list post-list-style3"><div class="post-list-content"><a href="{$v.url}" title="{$v.name}"><img src="{$v.pic}" alt="{$v.name}" class="imgPlay" style="height:240px;object-fit:cover;"></a><h4 class="pt-2"><a href="{$v.url}" title="{$v.name}">{$v.name}</a></h4><ul class="entry-meta"><li class="post-date"><span class="line"></span> {$v.views} 人观看</li></ul></div></div></div>
{/loop}
</div>
<div class="pagination" id="wr-page">
<script src="/template/9C18A513/js/jQuery.js"></script>
<script src="/template/9C18A513/js/page.js?t=1"></script>
<script type="text/javascript">
$("#wr-page").wrpage({
pagesize: '{$videos}',
wr_current: '{$page}',
baseUrl: '{$page_baseurl}',
})
</script>
</div>
</div>
</div>
</section>
<!-- 页尾 开始 -->
{inc:footer.html}
<!-- 页尾 结束 -->
<script src="/template/9C18A513/js/popper.min.js"></script>
<script src="/template/9C18A513/js/bootstrap.min.js"></script>
<script src="/template/9C18A513/js/theia-sticky-sidebar.js"></script>
<script src="/template/9C18A513/js/ajax-contact.js"></script>
<script src="/template/9C18A513/js/owl.carousel.min.js"></script>
<script src="/template/9C18A513/js/switch.js"></script>
<script src="/template/9C18A513/js/jquery.marquee.js"></script>
<script src="/template/9C18A513/js/main.js"></script>
</body>
</html>
