{inc:user/head.html}
{inc:user/header.html}
{inc:user/sidebar.html}
<div class="main-content app-content mt-0">
	<div class="side-app">
		<div class="main-container container-fluid">
			<div class="row mt-5">

				<div class="col-lg-12 col-xl-12">

					<div class="card">
						<div class="card-header border-bottom-0">
							<h2 class="card-title">{$lang.update_password}</h2>
						</div>
						<div class="card-body">
							<div class="col-lg-6 mx-auto">
								<form action="{$passwd_url}" method="post" id="form">
									<div class="form-group input-group">
										<div class="input-group-prepend">
											<span class="input-group-text"><i class="fe fe-lock"></i></span>
										</div>
										<input type="password" class="form-control" id="password_old"
											name="password_old" placeholder="{$lang.password_old}" required>
										<div class="invalid-feedback"></div>
									</div>

									<div class="form-group input-group">
										<div class="input-group-prepend">
											<span class="input-group-text"><i class="fe fe-lock"></i></span>
										</div>
										<input type="password" class="form-control" id="password_new"
											name="password_new" placeholder="{$lang.password_new}" required>
										<div class="invalid-feedback"></div>
									</div>

									<div class="form-group input-group">
										<div class="input-group-prepend">
											<span class="input-group-text"><i class="fe fe-lock"></i></span>
										</div>
										<input type="password" class="form-control" id="password_new_repeat"
											name="password_new_repeat" placeholder="{$lang.password_new_repeat}"
											required>
										<div class="invalid-feedback"></div>
									</div>
									<div>
										<button type="submit" class="btn btn-primary btn-block" id="submit"
											data-loading-text="{$lang.submiting}...">
											{$lang.update_password}
										</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
</div>
{inc:user/footer.html}
{inc:user/foot.html}
<script src="/static/js/md5.js"></script>
<script>
	var body = $('body');
	body.on('submit', '#form', function () {
		var jthis = $(this);
		var jsubmit = jthis.find('#submit');
		jsubmit.button('loading');
		jthis.reset();
		var postdata = jthis.serializeObject();
		postdata.password_old = $.md5(postdata.password_old);
		postdata.password_new = $.md5(postdata.password_new);
		postdata.password_new_repeat = $.md5(postdata.password_new_repeat);
		$.xpost(jthis.attr('action'), postdata, function (code, message) {
			if (code == 0) {
				$.alert(message);
				jsubmit.button(message).delay(3000).button('reset');
			} else if (xn.is_number(code)) {
				alert(message);
				jsubmit.button('reset');
			} else {
				jthis.find('[name="' + code + '"]').alert(message).focus();
				jsubmit.button('reset');
			}
		});
		return false;
	});
</script>
