<div class="search">
<div class="container-fluid">
<div class="search-width  text-center">
<button type="button" class="close"><i class="icon_close"></i></button>
<form id="search_form" class="search-form">
<input type="search" name="keyword" id="keyword" placeholder="视频搜索">
<button type="submit" class="search-btn">搜索</button>
</form>
</div>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const input = document.getElementById('keyword');
  const form = document.getElementById('search_form'); 
  form.onsubmit = function (e) {
    e.preventDefault(); // 阻止默认提交
    var keyword = input.value.trim();
    if (keyword === '') {
      alert('请输入关键词');
      input.focus();
      return false;
    } 
    var rw ={$conf.url_rewrite_on};
    var url = (rw === 0)
      ? '{$search_url}&keyword=' + encodeURIComponent(keyword)
      : '{$search_url}/' + encodeURIComponent(keyword); 
    window.location.href = url;
  };
});
</script>
