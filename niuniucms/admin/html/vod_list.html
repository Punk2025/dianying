<script>
    var jconfirm = $("#confirm");
    var jvodlist = $('#vodlist');
    /*删除选中的内容*/
jconfirm.on('click', function(){
	var jchecked = jvodlist.find('input[name="delete"]').filter(function(){ return this.checked; });
	if(jchecked.length < 1) return alert("<?php echo lang('please_check_delete_vod');?>");
	if(!window.confirm("<?php echo lang('vod_delete_confirm');?>")) return false; 
	jchecked.each(function() {
        var jtr = $(this).parents('tr');
		var vid = jtr.attr('vid'); 
        $.xpost(xn.url('vod-del', '', true), {vid: vid,}, function (code, message) {
            if (code == 0) { 
                window.location.reload();
            } else {
                $.alert(message);
            }
        });
	});
});
 
</script>
