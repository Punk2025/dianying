<script>
    body.on('click', '.install, .uninstall, .down', function () {
    var jthis = $(this);
    var href = jthis.data('href') || jthis.attr('href');
    $.xpost(href, function (code, message) {
        if (code == 0) {
            $.alert(message).delay(1000).location();
        } else {
            $.alert(message);
        }
    });
    return false;
});
</script>
