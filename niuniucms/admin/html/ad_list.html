<script>
$('body').on('click', 'a.ad-del', function(e) {
    e.preventDefault();
    var id = $(this).data('id');
    if (!id || !confirm('确定删除？')) return;
    $.xpost(xn.url('ad-delete', '', true), { id: id }, function(code, msg) {
        if (code == 0) { location.reload(); } else { alert(msg); }
    });
});
$('#ad_check_all').on('change', function () {
    $('.ad-id-cb').prop('checked', $(this).prop('checked'));
});
function adBatchStatus(st) {
    var ids = $('.ad-id-cb:checked').map(function () { return $(this).val(); }).get();
    if (!ids.length) {
        alert('请先勾选要操作的广告');
        return;
    }
    var tip = st ? '确定将选中的广告全部上架？' : '确定将选中的广告全部下架？';
    if (!confirm(tip)) return;
    $.xpost(xn.url('ad-batchstatus', '', true), { ids: ids, status: st }, function (code, msg) {
        if (code == 0) { location.reload(); } else { alert(msg); }
    });
}
$('#ad_batch_on').on('click', function () { adBatchStatus(1); });
$('#ad_batch_off').on('click', function () { adBatchStatus(0); });
$('#ad_batch_url_btn').on('click', function () {
    $('#ad_batch_url_input').val('');
});
$('#ad_batch_url_submit').on('click', function () {
    var ids = $('.ad-id-cb:checked').map(function () { return $(this).val(); }).get();
    if (!ids.length) {
        alert('请先勾选要操作的广告');
        return;
    }
    var u = $.trim($('#ad_batch_url_input').val());
    $.xpost(xn.url('ad-batchurl', '', true), { ids: ids, url: u }, function (code, msg) {
        if (code == 0) {
            var modalEl = document.getElementById('ad_batch_url_modal');
            if (modalEl && window.bootstrap && bootstrap.Modal) {
                bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            }
            location.reload();
        } else {
            alert(msg);
        }
    });
});
</script>
