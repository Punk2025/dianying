<script>
    var body = $('body'); 
    body.on('click', 'a.delete', function() {
        if (window.confirm('<确定删除吗？>')) {
            var href = $(this).data('href');
            $.xpost(href, {type:0}, function(code, message) {
                if(code == 0) {
                    window.location.reload();
                } else {
                    $.alert(message);
                }
            });
        }
        return false;
    }); 
    body.on('click', 'button.rank', function () {
        var rankarr = new Array();
        $('input[name="rank"]').each(function(){
            var id = $(this).attr('id');
            var oldrank = parseInt($(this).attr('rank'), 10);
            var rank = parseInt($(this).val(), 10);
            rankarr.push({id:id,oldrank:oldrank,rank:rank});
        });
        $.xpost(xn.url('set-player','', true), {type:2,data:rankarr}, function (code, message) {
            if (code == 0) {
                $.alert(message);
                setTimeout(function() {
                    window.location.reload();
                }, 1000);
            } else {
                $.alert(message);
            }
        });
    });
 
</script>
