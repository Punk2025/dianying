<script>
    var body = $('body');  
    body.on('click', 'button.rank', function () {
        var rankarr = new Array();
        $('input[name="rank"]').each(function(){
            var id = $(this).attr('id');
            var oldrank = $(this).attr('rank');
            var rank = $(this).val();
            rankarr.push({id:id,oldrank:oldrank,rank:rank});
        });
        $.xpost(xn.url('set-route','', true), {data:rankarr}, function (code, message) {
            if (code == 0) {
                $.alert(message);
                setTimeout(function() {
                    window.location.reload();
                }, 1000);
            } else {
                $.alert(message);
            }
        });
    });
 
</script>
