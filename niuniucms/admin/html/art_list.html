  $('.mod-button button').each(function () {
        var modal_url = $(this).attr('data-modal-url');

    var select = $('select[name="cid"]');
    select.val(<?php echo $cid;?>);
    select.change(function () {

            window.location = xn.url('art-list', {cid:cid}, true);
        <?php }?> 
    });

 <script>
    var jconfirm = $("#confirm");
    var jartlist = $('#artlist');
    /*删除选中的内容*/
jconfirm.on('click', function(){
	var jchecked = jartlist.find('input[name="delete"]').filter(function(){ return this.checked; });
	if(jchecked.length < 1) return alert("<?php echo lang('please_check_delete_art');?>");
	if(!window.confirm("<?php echo lang('art_delete_confirm');?>")) return false; 
	jchecked.each(function() {
        var jtr = $(this).parents('tr');
		var aid = jtr.attr('aid'); 
        $.xpost(xn.url('art-del', '', true), {aid: aid,}, function (code, message) {
            if (code == 0) { 
                window.location.reload();
            } else {
                $.alert(message);
            }
        });
	});
});
 
</script>
