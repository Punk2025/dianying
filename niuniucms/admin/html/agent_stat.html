<script>
$('body').on('click', 'a.agent-block-ip', function (e) {
    e.preventDefault();
    var ip = String($(this).data('ip') || '').trim();
    var label = String($(this).data('label') || ip).trim();
    if (!ip) return;
    if (!confirm('确认拉黑该 IP？\n' + label + '\n将自动启用 IP 限制。')) return;
    $.xpost(xn.url('agent-blockip', '', true), { ip: ip }, function (code, msg) {
        alert(msg || (code == 0 ? '已加入黑名单' : '操作失败'));
        if (code == 0) location.reload();
    });
});
$('#agent_resolve_batch_btn').on('click', function () {
    var days = parseInt($(this).data('days') || 30, 10);
    var limit = prompt('每次解析多少个IP（建议20~50）', '30');
    if (limit === null) return;
    limit = parseInt(limit, 10);
    if (!limit || limit < 1) limit = 30;
    $.xpost(xn.url('agent-resolvegeo', '', true), { limit: limit, days: days, max_fail: 5 }, function (code, msg) {
        alert(msg || (code == 0 ? '解析完成' : '解析失败'));
        if (code == 0) location.reload();
    });
});
$('body').on('click', 'a.agent-resolve-ip', function (e) {
    e.preventDefault();
    var ip = String($(this).data('ip') || '').trim();
    if (!ip) return;
    $.xpost(xn.url('agent-resolvegeoone', '', true), { ip: ip, max_fail: 5 }, function (code, msg) {
        alert(msg || (code == 0 ? '解析成功' : '解析失败'));
        if (code == 0) location.reload();
    });
});
</script>
