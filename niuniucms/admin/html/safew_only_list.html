<script>
function formToPostObject($form){var post={};$form.serializeArray().forEach(function(it){var k=it.name;if(k.slice(-2)==='[]'){if(!Array.isArray(post[k]))post[k]=[];post[k].push(it.value);}else{post[k]=it.value;}});return post;}
function collectBotRows(rowSelector){var rows=[];$(rowSelector).each(function(){rows.push({name:$(this).find('input[name$="_bot_name[]"]').val()||'',token:$(this).find('input[name$="_bot_token[]"]').val()||'',enabled:$(this).find('input[name$="_bot_enabled[]"]').prop('checked')?'1':'0'});});return rows;}
$('#safew_save_btn').on('click', function(){var post=formToPostObject($('#safew_conf_form'));var bots=collectBotRows('.safew-bot-row');post['safew_bot_name[]']=bots.map(function(b){return b.name;});post['safew_bot_token[]']=bots.map(function(b){return b.token;});post['safew_bot_enabled[]']=bots.map(function(b){return b.enabled;});$.xpost(xn.url('safew-save','',true),post,function(code,msg){alert(msg||(code===0?'保存成功':'保存失败'));if(code===0)location.reload();});});
$('#safew_sync_btn').on('click', function(){ $.xpost(xn.url('safew-sync','',true),{},function(code,msg){alert(msg||(code===0?'同步完成':'同步失败'));if(code===0)location.reload();});});
$('#safew_push_btn').on('click', function(){ if(!confirm('立即执行一次手动推送？')) return; $.xpost(xn.url('safew-push','',true),{},function(code,msg){alert(msg||(code===0?'推送完成':'推送失败'));});});
$('body').on('click','a.safew-toggle',function(e){e.preventDefault();var id=$(this).data('id'),enabled=$(this).data('enabled');$.xpost(xn.url('safew-toggle','',true),{id:id,enabled:enabled},function(code,msg){alert(msg||(code===0?'已更新':'操作失败'));if(code===0)location.reload();});});
$('#safew_menu_add').on('click', function(){ $('#safew_menu_box').append('<div class="row g-2 mb-2 safew-menu-row"><div class="col-md-4"><input type="text" class="form-control" name="safew_menu_name[]" value="" placeholder="按钮名称"></div><div class="col-md-7"><input type="text" class="form-control" name="safew_menu_url[]" value="" placeholder="跳转链接"></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger w-100 safew-menu-del">删</button></div></div>');});
$('body').on('click','.safew-menu-del',function(){ if($('.safew-menu-row').length<=1){$(this).closest('.safew-menu-row').find('input').val('');return;} $(this).closest('.safew-menu-row').remove();});
$('#safew_bot_add').on('click', function(){ $('#safew_bot_box').append('<div class="row g-2 mb-2 safew-bot-row"><div class="col-md-3"><input type="text" class="form-control" name="safew_bot_name[]" value="" placeholder="机器人名称"></div><div class="col-md-7"><input type="text" class="form-control" name="safew_bot_token[]" value="" placeholder="BOT_TOKEN"></div><div class="col-md-1 d-flex align-items-center"><label class="mb-0"><input type="checkbox" name="safew_bot_enabled[]" value="1" checked> 启用</label></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger w-100 safew-bot-del">删</button></div></div>');});
$('body').on('click','.safew-bot-del',function(){ if($('.safew-bot-row').length<=1){$(this).closest('.safew-bot-row').find('input[type=text]').val('');return;} $(this).closest('.safew-bot-row').remove();});
</script>
