<script>
    (function () {
        var logoUploadUrl = <?php echo xn_json_encode(url('set-logo_upload', array('json' => 1), TRUE)); ?>;
        var mobileQrUploadUrl = <?php echo xn_json_encode(url('set-mobile_qr_upload', array('json' => 1), TRUE)); ?>;
        function nnUploadLogo(fileInput, targetId) {
            if (!fileInput.files || !fileInput.files.length) {
                return;
            }
            var fd = new FormData();
            fd.append('logo', fileInput.files[0]);
            $.ajax({
                url: logoUploadUrl,
                type: 'POST',
                data: fd,
                processData: false,
                contentType: false,
                dataType: 'json',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                success: function (res) {
                    if (res && res.code === 0 && res.url) {
                        $('#' + targetId).val(res.url);
                        if (typeof $.alert === 'function') {
                            $.alert(res.message || '上传成功');
                        } else {
                            alert(res.message || '上传成功');
                        }
                    } else {
                        alert((res && res.message) ? res.message : '上传失败');
                    }
                },
                error: function (xhr) {
                    var msg = '上传失败';
                    try {
                        var r = JSON.parse(xhr.responseText);
                        if (r && r.message) {
                            msg = r.message;
                        }
                    } catch (e) {}
                    alert(msg);
                }
            });
            fileInput.value = '';
        }
        function nnUploadMobileQr(fileInput, targetId) {
            if (!fileInput.files || !fileInput.files.length) {
                return;
            }
            var fd = new FormData();
            fd.append('mobile_qr', fileInput.files[0]);
            $.ajax({
                url: mobileQrUploadUrl,
                type: 'POST',
                data: fd,
                processData: false,
                contentType: false,
                dataType: 'json',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                success: function (res) {
                    if (res && res.code === 0 && res.url) {
                        $('#' + targetId).val(res.url);
                        if (typeof $.alert === 'function') {
                            $.alert(res.message || '上传成功');
                        } else {
                            alert(res.message || '上传成功');
                        }
                    } else {
                        alert((res && res.message) ? res.message : '上传失败');
                    }
                },
                error: function (xhr) {
                    var msg = '上传失败';
                    try {
                        var r = JSON.parse(xhr.responseText);
                        if (r && r.message) {
                            msg = r.message;
                        }
                    } catch (e) {}
                    alert(msg);
                }
            });
            fileInput.value = '';
        }
        $('#logo_pc_file').on('change', function () {
            nnUploadLogo(this, 'logo_pc');
        });
        $('#logo_m_file').on('change', function () {
            nnUploadLogo(this, 'logo_m');
        });
        $('#mobile_watch_qr_file').on('change', function () {
            nnUploadMobileQr(this, 'mobile_watch_qr');
        });
    })();
    var jform = $('#form');
    jform.on('submit', function() {
        jform.reset();
        var jthis = $(this);
        var jsubmit = jthis.find('#submit');
        jsubmit.button('loading');
        var postdata = jform.serialize();
        $.xpost(jform.attr('action'), postdata, function(code, message) {
            if(code == 0) {
                $.alert(message);
                jsubmit.text(message).delay(1000).location();
            } else if(xn.is_number(code)) {
                alert(message);
                jsubmit.button('reset');
            } else {
                jform.find('[name="'+code+'"]').alert(message).focus();
                jsubmit.button('reset');
            }
        });
        return false;
    }); 
    </script>
